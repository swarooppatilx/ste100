[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ste100-checker"
dynamic = ["version"]
description = "Rule-based ASD-STE100 (Simplified Technical English) compliance checker"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "spacy>=3.8.12,<3.8.14",
    "typer",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "build",
    "twine",
]

[project.scripts]
ste100 = "src.cli:app"

[tool.setuptools]
package-dir = {"src" = "src"}

[tool.setuptools.dynamic]
version = {attr = "src.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]
